<script>
const {ranges, coverage, team, verticals, days: dailyRecords, sample, verticalManagers, unavailableMetrics = [], asOf = "Extraction time not supplied"} =
  JSON.parse(document.querySelector("#report-data").textContent);
const firstDate = coverage.start;
const lastDate = coverage.end;
const millisecondsPerDay = 86400000;

const leadStages = [["hot", "Hot"], ["deadJunk", "Dead/Junk"], ["cold", "Cold"], ["warm", "Warm"]];
const measures = ["arrived", "leads", "attempts", "connected", "followups", "stageMoves", "enrolled", "sales", "nbfcApproved", "nbfcRejected", "saleValue", "revenue", "talk", ...leadStages.map(([key]) => key)];
const integerFormat = new Intl.NumberFormat("en-IN");
const number = {format: value => value == null ? "—" : integerFormat.format(value)};
const currency = new Intl.NumberFormat("en-IN", {style: "currency", currency: "INR"});
const rupees = {format: paise => paise == null ? "—" : currency.format(paise / 100)};
const dayFormat = new Intl.DateTimeFormat("en-IN", {weekday: "short", day: "numeric", month: "short", timeZone: "UTC"});
const datePreset = document.querySelector("#date-preset");
const dateSlicerLabel = document.querySelector("#date-slicer-label");
const dateFields = document.querySelector("#date-fields");
const startDate = document.querySelector("#start-date");
const endDate = document.querySelector("#end-date");
const rangeError = document.querySelector("#range-error");
const vertical = document.querySelector("#vertical");
const report = document.querySelector("#report");
const breadcrumb = document.querySelector("#breadcrumb");
const backButton = document.querySelector("#back-button");
const resetFilters = document.querySelector("#reset-filters");

const bdeDialog = document.querySelector("#bde-dialog");
for (const input of [startDate, endDate]) {
  input.min = firstDate;
  input.max = lastDate;
}
let cohortRange = ranges.all;
let timeRange = ranges.all;
let cohortPreset = "All Time";
let timePreset = "All Time";
let pendingCohortRange = ranges.all;
let pendingTimeRange = ranges.all;
let pendingCohortPreset = "All Time";
let pendingTimePreset = "All Time";
let customBasis = "cohort";
let customPending = false;
vertical.innerHTML = '<option value="all">All verticals</option>' + verticals.map((name, index) => `<option value="${index}">${name}</option>`).join("");
let selectedBde = null;
let selectedDay = null;
let selectedVerticalScreen = null;
let selectedLead = null;

function total(records) {
  const sums = Object.fromEntries(measures.map(key => [
    key, records.reduce((sum, record) => sum + (record[key] ?? 0), 0),
  ]));
  const contacts = [...new Set(records.flatMap(record => record.contacts ?? []))];
  const workingDays = records.reduce((sum, record) => sum + (record.workingDays ?? ((record.attempts ?? 0) > 0 ? 1 : 0)), 0);
  return {...sums, ...Object.fromEntries(unavailableMetrics.map(key => [key, null])), contacts, workingDays};
}

function calendarDate(isoDate) {
  return new Date(isoDate + "T00:00:00Z");
}

function inRange(key, range) { return key >= range.start && key <= range.end; }
function reportDays(bde) {
  const start = calendarDate(cohortRange.start < timeRange.start ? cohortRange.start : timeRange.start);
  const end = calendarDate(cohortRange.end > timeRange.end ? cohortRange.end : timeRange.end);
  const dayCount = (end - start) / millisecondsPerDay + 1;
  return Array.from({length: dayCount}, (_, offset) => {
    const date = new Date(start.getTime() + offset * millisecondsPerDay);
    const key = date.toISOString().slice(0, 10);
    const record = dailyRecords[bde.id + "/" + key] ?? {};
    const hours = record.hours ?? [];
    const cohortActive = inRange(key, cohortRange);
    const timeActive = inRange(key, timeRange);
    const row = {...total(timeActive ? hours : []), ...record, date: dayFormat.format(date), hours: timeActive ? hours : []};
    row.workingDays = timeActive && row.attempts > 0 ? 1 : 0;
    if (!cohortActive) for (const field of ["arrived", "leads", "hot", "deadJunk", "cold", "warm", "enrolled", "sales", "nbfcApproved", "nbfcRejected", "saleValue"]) row[field] = 0;
    if (!timeActive) { row.followups = 0; row.revenue = 0; }
    return row;
  });
}

function action(label, name, value = "") {
  return `<button class="link" type="button" data-action="${name}" data-value="${value}">${label}</button>`;
}

function cards(items) {
  return `<div class="cards">${items.map(([label, value]) =>
    `<div class="card"><span>${label}</span><strong>${value}</strong></div>`).join("")}</div>`;
}

function duration(seconds) {
  const rounded = Math.max(0, Math.round(Number(seconds) || 0));
  const hours = Math.floor(rounded / 3600);
  const minutes = Math.floor((rounded % 3600) / 60);
  const remainingSeconds = rounded % 60;
  return `${hours}:${String(minutes).padStart(2, "0")}:${String(remainingSeconds).padStart(2, "0")}`;
}

function averageTalkPerWorkingDay(summary) {
  return summary.workingDays ? duration(summary.talk / summary.workingDays) : "—";
}

function averageTalk(summary) {
  return summary.connected ? duration(summary.talk / summary.connected) : "—";
}

function metrics(summary, extra = []) {
  return cards([...extra, ["Leads arrived", number.format(summary.arrived)],
    ["Call attempts", number.format(summary.attempts)], ["Unique calls", number.format(summary.contacts.length)],
    ["Connected calls", number.format(summary.connected)], ["Avg. talk time / working day (HH:MM:SS)", averageTalkPerWorkingDay(summary)],
    ["Enrolled", number.format(summary.enrolled)], ["NBFC approved", number.format(summary.nbfcApproved)], ["NBFC rejected", number.format(summary.nbfcRejected)],
    ["Sale value", rupees.format(summary.saleValue)],
    ["Revenue", rupees.format(summary.revenue)]]);
}

function table(title, headers, rows, {note = "", footer = "", textCols = [], scrollable = true, className = ""} = {}) {
  return `<section class="panel"><div class="section-head"><h3>${title}</h3>
    ${note ? `<p class="muted">${note}</p>` : ""}</div>
    <div class="${scrollable ? "scroll" : "table-fit"}"${scrollable ? ` tabindex="0" role="region" aria-label="${title}"` : ""}><table class="${className}">
    <thead><tr>${headers.map((label, index) => `<th scope="col" class="${textCols.includes(index) ? "text" : ""}">${label}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(row => `<tr>${row.map((cell, index) => `<td class="${textCols.includes(index) ? "text" : ""}">${cell}</td>`).join("")}</tr>`).join("")}</tbody>
    ${footer ? `<tfoot><tr>${footer.map(cell => `<td>${cell}</td>`).join("")}</tr></tfoot>` : ""}
    </table></div></section>`;
}

function renderOverview() {
  const members = team.filter(member => vertical.value === "all" || member.vertical === Number(vertical.value))
    .map(member => ({...member, summary: total(reportDays(member))}));
  const groups = verticals.map((name, index) => ({
    name, index, members: members.filter(member => member.vertical === index),
  })).filter(group => vertical.value === "all" || group.index === Number(vertical.value));
  const groupSummaries = groups.map(group => ({...group, summary: total(group.members.map(member => member.summary))}))
    .sort((a, b) => b.summary.saleValue - a.summary.saleValue || b.summary.revenue - a.summary.revenue);
  const memberDays = members.map(member => reportDays(member));
  const trend = memberDays.length ? memberDays[0].map((day, index) => total(memberDays.map(days => days[index]))) : [];
  const trendMax = Math.max(1, ...trend.flatMap(day => [day.saleValue, day.revenue]));
  const trendPoints = key => trend.map((day, index) => `${30 + (trend.length < 2 ? 0 : 900 * index / (trend.length - 1))},${190 - 145 * (day[key] || 0) / trendMax}`).join(" ");
  const trendArea = key => `30,190 ${trendPoints(key)} 930,190`;
  const trendVisual = `<section class="panel"><div class="section-head"><h3>Sale value and Revenue area chart</h3></div><div class="trend-chart"><div class="trend-key"><span><i style="background:#6d55b6"></i>Sale value</span><span><i style="background:#1687a7"></i>Revenue</span></div><svg viewBox="0 0 960 230" role="img" aria-label="Sale value and Revenue area chart over the selected period"><line class="trend-grid" x1="30" y1="45" x2="930" y2="45"/><line class="trend-grid" x1="30" y1="118" x2="930" y2="118"/><line class="trend-grid" x1="30" y1="190" x2="930" y2="190"/><polygon class="trend-sale-area" points="${trendArea("saleValue")}"/><polygon class="trend-revenue-area" points="${trendArea("revenue")}"/><polyline class="trend-sale" points="${trendPoints("saleValue")}"/><polyline class="trend-revenue" points="${trendPoints("revenue")}"/><text class="trend-label" x="30" y="218">Cohort ${rangeLabel(cohortRange)}</text><text class="trend-label" x="930" y="218" text-anchor="end">Time ${rangeLabel(timeRange)}</text></svg></div></section>`;
  const top = (label, entry, value, note = "") => `<article class="leader-card"><span>${label}</span><strong>${entry?.name || "—"}</strong><b>${value}</b>${note ? `<small>${note}</small>` : ""}</article>`;
  const leaderCards = group => { const ranked = group.members.map(member => ({...member, summary: member.summary})); const highest = key => ranked.slice().sort((a, b) => b.summary[key] - a.summary[key])[0]; const callDays = group.members.flatMap(member => reportDays(member).map(day => ({member, day}))).sort((a, b) => b.day.attempts - a.day.attempts); return `<div class="leader-grid">${top("Highest total talk time", highest("talk"), duration(highest("talk")?.summary.talk || 0))}${top("Highest sales count", highest("sales"), number.format(highest("sales")?.summary.sales || 0))}${top("Highest sale value", highest("saleValue"), rupees.format(highest("saleValue")?.summary.saleValue || 0))}${top("Highest revenue", highest("revenue"), rupees.format(highest("revenue")?.summary.revenue || 0))}${top("Highest calls in a day", callDays[0]?.member, number.format(callDays[0]?.day.attempts || 0), callDays[0]?.day.date || "")}</div>`; };
  const leaders = `<section class="panel"><div class="section-head"><h3>Top performers by vertical</h3></div>${groups.map(group => `<div class="leader-vertical"><h4>${group.name}</h4>${leaderCards(group)}</div>`).join("")}</section>`;
  return `${metrics(total(members.map(member => member.summary)), [["BDEs", members.length]])}
  ${table("Vertical performance", ["Vertical", "Manager", "BDEs", "Leads arrived", "Call attempts", "Enrolled", "Sale value", "Revenue", ""],
    groupSummaries.map(group => {
      const summary = group.summary;
      return [group.name, verticalManagers[group.name] || "", group.members.length, number.format(summary.arrived), number.format(summary.attempts), number.format(summary.enrolled), rupees.format(summary.saleValue), rupees.format(summary.revenue),
        action("Open BDE reports →", "vertical", group.index)];
    }), {textCols: [1, 8], scrollable: false, className: "vertical-table"})}
  ${leaders}
  ${trendVisual}`;
}

function leadLabel(member) {
  return member.lead || `Direct to ${verticalManagers[verticals[member.vertical]] || "manager"}`;
}

function verticalTitle(index) {
  return verticals[index] === "Govt Central" ? "RRB, SSC & Banking · Dilip Kumar" : `${verticals[index]} · ${verticalManagers[verticals[index]] || ""}`;
}

function performanceRows(members) {
  return members.map(member => {
    const summary = total(reportDays(member));
    return {member, summary};
  }).sort((a, b) => b.summary.saleValue - a.summary.saleValue || b.summary.revenue - a.summary.revenue || b.summary.leads - a.summary.leads)
    .map(({member, summary}) => [member.name, number.format(summary.leads), number.format(summary.arrived), number.format(summary.attempts), number.format(summary.connected), number.format(summary.enrolled), rupees.format(summary.saleValue), rupees.format(summary.revenue), action("Open report →", "bde", member.id)]);
}

function renderVerticalScreen(index) {
  const members = team.filter(member => member.vertical === index);
  const summary = total(members.map(member => total(reportDays(member))));
  const groups = [...new Set(members.map(leadLabel))].map(lead => ({lead, members: members.filter(member => leadLabel(member) === lead)}));
  return `<h2 tabindex="-1">${verticalTitle(index)}</h2><p class="muted">Team performance and individual BDE reports</p>
    ${metrics(summary, [["BDEs", members.length], ["Leads assigned", number.format(summary.leads)]])}
    ${table("Team performance", ["Team Lead", "BDEs", "Leads assigned", "Leads arrived", "Call attempts", "Sale value", "Revenue", ""], groups.map(group => { const value = total(group.members.map(member => total(reportDays(member)))); return [group.lead, group.members.length, number.format(value.leads), number.format(value.arrived), number.format(value.attempts), rupees.format(value.saleValue), rupees.format(value.revenue), action("View team →", "team", `${index}|${group.lead}`)]; }), {textCols:[0,7], scrollable:false, className:"vertical-table"})}
    ${table("Individual BDE performance", ["BDE", "Leads assigned", "Leads arrived", "Call attempts", "Connected", "Enrolled", "Sale value", "Revenue", ""], performanceRows(members), {textCols:[0,8], scrollable:false, className:"vertical-table"})}`;
}

function renderTeamScreen(index, lead) {
  const members = team.filter(member => member.vertical === index && leadLabel(member) === lead);
  const summary = total(members.map(member => total(reportDays(member))));
  return `<h2 tabindex="-1">${lead} · Team performance</h2><p class="muted">${verticalTitle(index)}</p>
    ${metrics(summary, [["BDEs", members.length], ["Leads assigned", number.format(summary.leads)]])}
    ${table("Individual BDE performance", ["BDE", "Leads assigned", "Leads arrived", "Call attempts", "Connected", "Enrolled", "Sale value", "Revenue", ""], performanceRows(members), {textCols:[0,8], scrollable:false, className:"vertical-table"})}`;
}

function renderBde(bde, days) {
  days = days.slice().sort((a, b) => b.saleValue - a.saleValue || b.revenue - a.revenue || b.arrived - a.arrived);
  return `<h2 tabindex="-1">${bde.name} · Productivity</h2>
    <p class="muted">${verticals[bde.vertical]} · ${bde.lead}</p>
    ${metrics(total(days))}
    ${table("Day-wise performance", ["Day", "Leads arrived", "Leads assigned", "Call attempts", "Unique calls", "Connected", "Avg. talk time per connected call (HH:MM:SS)", "Follow-ups completed", "Enrolled", "Sale value", "Revenue", ""],
      days.map((day, index) => [day.date, day.arrived, day.leads, day.attempts, day.contacts.length, day.connected,
        averageTalk(day), number.format(day.followups), number.format(day.enrolled), rupees.format(day.saleValue), rupees.format(day.revenue), action("View day →", "day", index)]),
      {textCols: [10]})}`;
}

function renderDaily(bde, day) {
  const rate = (connected, attempts) => attempts ? Math.round(100 * connected / attempts) + "%" : "—";
  const callingCells = summary => [summary.attempts, summary.contacts.length, summary.connected, summary.attempts - summary.connected,
    duration(summary.talk), averageTalk(summary), rate(summary.connected, summary.attempts)];
  const hours = day.hours.map(hour => [
    `${String(hour.hour).padStart(2, "0")}:00–${hour.hour + 1}:00`, ...callingCells(hour),
  ]);
  return `<h2 tabindex="-1">${bde.name} · ${day.date}</h2>
    ${metrics(day)}
    <div class="split">
    ${table("Hourly calling activity", ["Hour (IST)", "Call attempts", "Unique calls", "Connected", "Not connected (>2s rule)", "Talk time (HH:MM:SS)", "Avg. talk time (HH:MM:SS)", "Connection rate"], hours,
      {footer: ["Day total", ...callingCells(day)]})}
    ${table("Daily CRM activity", ["CRM metric", "Value"], [
      ["Leads arrived", day.arrived], ["Leads assigned", day.leads], ["Dead/Junk leads", day.deadJunk], ["Follow-ups completed", number.format(day.followups)], ["Pending follow-ups", number.format(day.pending)],
      ["Enrolled", number.format(day.enrolled)], ["NBFC rejected", number.format(day.nbfcRejected)], ["Sale value", rupees.format(day.saleValue)], ["Revenue", rupees.format(day.revenue)],
    ])}
    </div>`;
}

function render(focusHeading = false) {
  backButton.hidden = selectedBde === null && selectedVerticalScreen === null && vertical.value === "all";
  backButton.textContent = selectedDay !== null ? "← Back to BDE report" : selectedBde !== null ? (selectedLead !== null ? "← Back to team performance" : "← Back to vertical performance") : selectedLead !== null ? "← Back to vertical performance" : "← Back to overview";
  const bde = team.find(member => member.id === selectedBde);
  const days = bde ? reportDays(bde).sort((a, b) => b.saleValue - a.saleValue || b.revenue - a.revenue || b.arrived - a.arrived) : [];
  if (selectedBde !== null && bde) {
    breadcrumb.hidden = false;
    breadcrumb.innerHTML = selectedDay === null ? '<span aria-current="page">BDE report</span>' : action("BDE report", "weekly") + '<span>›</span><span aria-current="page">Daily detail</span>';
    report.innerHTML = selectedDay === null ? renderBde(bde, days) : renderDaily(bde, days[selectedDay]);
  } else if (selectedLead !== null && selectedVerticalScreen !== null) {
    breadcrumb.hidden = false;
    breadcrumb.innerHTML = '<span aria-current="page">Team performance</span>';
    report.innerHTML = renderTeamScreen(selectedVerticalScreen, selectedLead);
  } else if (selectedVerticalScreen !== null) {
    breadcrumb.hidden = false;
    breadcrumb.innerHTML = '<span aria-current="page">Vertical performance</span>';
    report.innerHTML = renderVerticalScreen(selectedVerticalScreen);
  } else {
    breadcrumb.hidden = true;
    breadcrumb.innerHTML = "";
    report.innerHTML = renderOverview();
  }
  if (focusHeading) report.querySelector("h2")?.focus();
}

backButton.addEventListener("click", () => {
  if (selectedDay !== null) selectedDay = null;
  else if (selectedBde !== null) selectedBde = null;
  else if (selectedLead !== null) selectedLead = null;
  else if (selectedVerticalScreen !== null) { selectedVerticalScreen = null; vertical.value = "all"; }
  else vertical.value = "all";
  render(true);
});

document.querySelector("main").addEventListener("click", event => {
  const button = event.target.closest("button[data-action]");
  if (!button) return;
  const {action: type, value} = button.dataset;
  if (type === "vertical") {
    selectedVerticalScreen = Number(value);
    selectedLead = null;
    selectedBde = null;
    selectedDay = null;
    vertical.value = value;
    render(true);
    return;
  }
  if (type === "team") { const [verticalIndex, lead] = value.split("|"); selectedVerticalScreen = Number(verticalIndex); selectedLead = lead; selectedBde = null; selectedDay = null; render(true); return; }
  if (type === "overview") selectedBde = null;
  if (type === "bde") { selectedBde = Number(value); }
  selectedDay = type === "day" ? Number(value) : null;
  render(true);
});
const rangeFormat = new Intl.DateTimeFormat("en-GB", {
  day: "numeric", month: "short", year: "numeric", timeZone: "UTC",
});

function rangeLabel(range) {
  const start = calendarDate(range.start);
  const end = calendarDate(range.end);
  if (range.start === range.end) return rangeFormat.format(start);
  if (range.start.slice(0, 7) === range.end.slice(0, 7)) {
    return `${start.getUTCDate()}–${rangeFormat.format(end)}`;
  }
  return rangeFormat.format(start) + " – " + rangeFormat.format(end);
}

function updateSlicerLabel() {
  dateSlicerLabel.textContent = `Applied: ${rangeLabel(timeRange)}`;
}

function setPendingRange(basis, range, label) {
  if (basis === "cohort") { pendingCohortRange = range; pendingCohortPreset = label; }
  else { pendingTimeRange = range; pendingTimePreset = label; }
  updatePendingButtons();
}

function updatePendingButtons() {}

function resetPendingDateRanges() {
  pendingCohortRange = ranges.all;
  pendingTimeRange = ranges.all;
  pendingCohortPreset = "All Time";
  pendingTimePreset = "All Time";
  customPending = false;
  dateFields.hidden = true;
  startDate.disabled = endDate.disabled = true;
  rangeError.hidden = true;
  updatePendingButtons();
}

function applyPendingRanges() {
  for (const range of [pendingCohortRange, pendingTimeRange]) {
    if (!range.start || !range.end || range.start > range.end || range.start < firstDate || range.end > lastDate) {
      rangeError.textContent = `Data available only from ${firstDate} through ${lastDate}. Refresh the source report before selecting later dates.`;
      rangeError.hidden = false;
      return;
    }
  }
  cohortRange = pendingCohortRange;
  timeRange = pendingTimeRange;
  cohortPreset = pendingCohortPreset;
  timePreset = pendingTimePreset;
  selectedDay = null;
  rangeError.hidden = true;
  updateSlicerLabel();

  render();
}

function isoDate(date) {
  return date.toISOString().slice(0, 10);
}

function todayInIst() {
  const parts = Object.fromEntries(new Intl.DateTimeFormat("en-US", {timeZone: "Asia/Kolkata", year: "numeric", month: "2-digit", day: "2-digit"})
    .formatToParts(new Date()).filter(part => part.type !== "literal").map(part => [part.type, part.value]));
  return `${parts.year}-${parts.month}-${parts.day}`;
}

function rangeForPreset(preset) {
  const end = calendarDate(todayInIst());
  const endKey = isoDate(end);
  const startAt = date => ({start: isoDate(date < calendarDate(firstDate) ? calendarDate(firstDate) : date), end: endKey});
  if (preset === "all") return ranges.all;
  if (preset === "today") return {start: endKey, end: endKey};
  if (preset === "yesterday") { const yesterday = isoDate(new Date(end.getTime() - millisecondsPerDay)); return {start: yesterday, end: yesterday}; }
  if (preset === "last7") return startAt(new Date(end.getTime() - 6 * millisecondsPerDay));
  if (preset === "last30") return startAt(new Date(end.getTime() - 29 * millisecondsPerDay));
  if (preset === "week") {
    const mondayOffset = (end.getUTCDay() + 6) % 7;
    return startAt(new Date(end.getTime() - mondayOffset * millisecondsPerDay));
  }
  if (preset === "mtd") return startAt(new Date(Date.UTC(end.getUTCFullYear(), end.getUTCMonth(), 1)));
  if (preset === "last3months") return startAt(new Date(Date.UTC(end.getUTCFullYear(), end.getUTCMonth() - 2, 1)));
  return ranges.all;
}

const presetLabels = {today: 'Today', yesterday: 'Yesterday', last7: 'Last 7 Days', last30: 'Last 30 Days', mtd: 'Month to Date', custom: 'Custom Range'};
function selectPeriod() {
  const preset = datePreset.value;
  customPending = preset === 'custom';
  dateFields.hidden = !customPending;
  startDate.disabled = endDate.disabled = !customPending;
  rangeError.hidden = true;
  if (!customPending) {
    const range = rangeForPreset(preset);
    setPendingRange('cohort', range, presetLabels[preset] || "Year to date");
    setPendingRange('time', range, presetLabels[preset] || "Year to date");
  }
}
datePreset.addEventListener('change', selectPeriod);
startDate.value = firstDate;
endDate.value = lastDate;
selectPeriod();

document.querySelector("#filters").addEventListener("submit", event => {
  event.preventDefault();
  if (customPending) {
    if (!startDate.value || !endDate.value || startDate.value < firstDate || endDate.value > lastDate || startDate.value > endDate.value) {
      rangeError.textContent = "Choose dates within the available range, with the end on or after the start.";
      rangeError.hidden = false;
      endDate.focus();
      return;
    }
    setPendingRange("cohort", {start: startDate.value, end: endDate.value}, "Custom Range");
    setPendingRange("time", {start: startDate.value, end: endDate.value}, "Custom Range");
  }
  applyPendingRanges();
});
resetFilters.addEventListener("click", () => {

  dateFields.hidden = true;
  startDate.disabled = endDate.disabled = true;
  vertical.value = "all";
  selectedBde = null;
  selectedDay = null;
  selectedVerticalScreen = null;
  selectedLead = null;
  cohortRange = ranges.all;
  timeRange = ranges.all;
  cohortPreset = "All Time";
  timePreset = "All Time";
  resetPendingDateRanges();
  datePreset.value = "all";
  startDate.value = firstDate; endDate.value = lastDate;
  selectPeriod();
  applyPendingRanges();
});

vertical.addEventListener("change", () => {
  selectedDay = null;
  selectedBde = null;
  selectedVerticalScreen = null;
  selectedLead = null;
  render();
});
updateSlicerLabel();
updatePendingButtons();
document.querySelector('#data-freshness').textContent = `Source snapshot: ${firstDate} through ${lastDate} (IST). Data cutoff: ${asOf}. ${lastDate < todayInIst() ? 'Today is not included. The source refresh has not reached today.' : 'Today is partial, through the last extraction.'} Apply filters this snapshot; it does not fetch new CRM data.`;
render();
</script>
</body>
</html>
