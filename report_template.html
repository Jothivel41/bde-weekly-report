<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BDE Productivity Report | Impacteers - Course team</title>
<style>
:root{color-scheme:light;--ink:#18263a;--muted:#58677b;--line:#dce5ed;--paper:#fff;--bg:#f4f7fa;--navy:#10243b;--accent:#0a675d;--pale:#e5f4ef}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Calibri,Carlito,Arial,sans-serif}
.wrap{width:min(1320px,calc(100% - 48px));margin:auto}
header{background:linear-gradient(112deg,#020719 8%,#07112f 44%,#3b2269 72%,#822943 100%);color:white;padding:24px 0 28px;border-bottom:4px solid #5c45db}
.tools,.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:15px;flex-wrap:wrap}
.brand-logo{display:block;width:142px;height:auto;margin:0;filter:none}.org{color:#f0efff;font-weight:600;font-size:1.05rem}
.date-fields{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.date-fields[hidden]{display:none}
.tools .range-note{flex-basis:100%}
.range-error{color:#a12525;font-size:.92rem}
button.apply,button.reset{border:0;border-radius:6px;padding:7px 12px;background:var(--accent);color:white;font-weight:700}
button.reset{background:white;color:var(--accent);border:1px solid var(--accent)}
h1{font-size:clamp(2rem,4vw,2.8rem);line-height:1.15;margin:18px 0 0;letter-spacing:-.025em}
main{padding:22px 0 40px}
.tools,.panel{border:1px solid var(--line);background:var(--paper);border-radius:12px}
.tools{justify-content:flex-end;padding:0;margin-bottom:17px;border:0;background:transparent;position:relative}
.slicer-toggle,.filter-select{border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink);font-weight:700;padding:8px 11px;min-height:36px;font-size:.9rem}.slicer-toggle{min-width:175px;text-align:left}.date-slicer{position:relative}.date-slicer summary{list-style:none}.date-slicer summary::-webkit-details-marker{display:none}.date-slicer[open] .slicer-toggle{border-color:#7656db;box-shadow:0 0 0 2px #ede8ff}.slicer-menu{position:absolute;right:0;top:44px;z-index:10;width:min(540px,calc(100vw - 48px));display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:10px;background:white;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 26px #18263a2b}.slicer-column{border:1px solid #e4e9ef;border-radius:10px;padding:8px}.slicer-column h3{padding:3px 7px 7px;border-bottom:1px solid var(--line);font-size:.95rem}.preset{display:block;width:100%;padding:5px 7px;text-align:left;background:transparent;border:0;border-radius:6px;color:var(--ink);font:inherit;font-size:.88rem}.preset:hover,.preset:focus-visible{background:#eee9ff;color:#6247d8;font-weight:700}.date-fields{grid-column:1/-1;padding:2px 5px 0}
label{display:flex;align-items:center;gap:8px;font-weight:600}
select,input,button{font:inherit}
select,input[type="date"]{border:1px solid #bac9d8;border-radius:6px;padding:6px 9px;background:white;color:var(--ink)}
button{cursor:pointer}
button#back-button{position:sticky;top:12px;z-index:5;margin:0 0 12px;padding:8px 16px;border:1px solid var(--accent);border-radius:6px;background:var(--accent);color:white;font-weight:700}
button.link{border:0;background:transparent;color:var(--accent);font-weight:700;text-align:left;padding:3px 0}
button.link:hover{text-decoration:underline}
:focus-visible{outline:3px solid #2977aa;outline-offset:3px}
nav{min-height:25px;color:var(--muted);font-size:.92rem}
nav span,nav button{margin-right:8px}
h2{font-size:1.58rem;margin:7px 0 3px;line-height:1.2}
h3{font-size:1.14rem;margin:0}
p{margin:0}
.muted{color:var(--muted);font-size:.92rem}
.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:12px 0}
.card{background:white;border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:68px}
.card span{display:block;color:var(--muted);font-size:.78rem;line-height:1.2}
.card strong{display:block;font-size:1.25rem;line-height:1.25;margin-top:4px;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.leader-vertical{border-top:1px solid var(--line);padding:13px 14px 0}.leader-vertical h4{margin:0 0 9px;font-size:1rem;color:var(--ink)}.leader-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;padding:0 0 14px}.leader-card{border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:linear-gradient(135deg,#fff 0%,#f3f7fb 100%);min-width:0}.leader-card span{display:block;color:var(--muted);font-size:.76rem}.leader-card strong{display:block;margin-top:6px;color:var(--accent);font-size:1rem;overflow-wrap:anywhere}.leader-card b{display:block;margin-top:5px;font-size:1.05rem;font-variant-numeric:tabular-nums}.leader-card small{color:var(--muted);font-size:.74rem}
.panel{margin-top:14px;overflow:hidden}
.section-head{padding:12px 16px}
.scroll{overflow:auto}
.table-fit{overflow:visible}
table{border-collapse:collapse;width:100%;white-space:nowrap;font-size:.93rem}
td,th{padding:8px 14px;text-align:right;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
td:first-child,th:first-child,.text{text-align:left}
thead th{background:#edf3f8;color:#42566c;font-weight:700}
tbody tr:hover{background:#f2f8f7}
tfoot td,tfoot th{background:var(--pale);font-weight:700}
.vertical-table{table-layout:fixed;white-space:normal}.vertical-table th,.vertical-table td{padding:8px 10px;font-size:.86rem}.vertical-table th:nth-child(1){width:12%}.vertical-table th:nth-child(2){width:15%}.vertical-table th:nth-child(3){width:6%}.vertical-table th:nth-child(4){width:12%}.vertical-table th:nth-child(5){width:12%}.vertical-table th:nth-child(6){width:8%}.vertical-table th:nth-child(7),.vertical-table th:nth-child(8){width:13%}.vertical-table th:nth-child(9){width:9%}
.split{display:grid;grid-template-columns:minmax(0,2fr) minmax(235px,1fr);gap:14px;align-items:start}
.visual-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:0 14px 14px}.visual-grid .panel{margin-top:0}
.visual-row{display:grid;grid-template-columns:minmax(80px,1fr) minmax(60px,4fr) auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.visual-row button{font:inherit}
.bar-track{height:10px;border-radius:999px;background:#e6edf3;overflow:hidden}.bar-fill{height:100%;border-radius:inherit;background:var(--accent)}
.bar-fill.sales{background:#6d55b6}.bar-fill.revenue{background:#1687a7}
.donut-wrap{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center;padding:16px}.donut{width:150px;height:150px;border-radius:50%;position:relative}.donut::after{content:var(--donut-label,"Leads\A arrived");white-space:pre;display:grid;place-items:center;text-align:center;position:absolute;inset:32px;border-radius:50%;background:white;color:var(--muted);font-weight:700;font-size:.85rem}.revenue-donut{--donut-label:"Revenue"}.legend{display:grid;gap:8px}.legend>span{display:flex;justify-content:space-between;gap:8px}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}.comparison{padding:16px;display:grid;gap:12px}.comparison-row{display:grid;grid-template-columns:90px 1fr;gap:8px;align-items:end}.comparison-bars{height:116px;display:flex;align-items:end;gap:8px;border-bottom:1px solid #a9bbcf;padding:0 10px}.comparison-bar{flex:1;min-height:3px;border-radius:6px 6px 0 0;position:relative}.comparison-bar.sales{background:#6d55b6}.comparison-bar.revenue{background:#1687a7}.comparison-bar b{position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);font-size:.72rem;white-space:nowrap}.comparison-label{font-weight:700;font-size:.84rem;line-height:1.15}.chart-key{display:flex;gap:12px;padding:0 16px 6px;font-size:.8rem;font-weight:700}.chart-key i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.metric-pair{display:grid;gap:4px;min-width:0}.metric-pair span{font-size:.78rem;color:var(--muted)}.metric-pair .bar-track{height:8px}.bde-links{display:flex;flex-wrap:wrap;gap:8px;padding:14px 16px}
.team-chart{padding:2px 16px 16px;display:grid;gap:10px}.team-chart-row{display:grid;grid-template-columns:130px repeat(3,minmax(0,1fr));gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.team-chart-row:first-child{border-top:0}.team-metric{display:grid;grid-template-columns:1fr auto;gap:7px;align-items:center}.team-metric span{font-size:.78rem;color:var(--muted);grid-column:1/-1}.team-metric .bar-track{height:8px}.team-metric strong{font-size:.85rem;white-space:nowrap}.team-metric.arrived .bar-fill{background:#0a675d}.team-metric.sales .bar-fill{background:#6d55b6}.team-metric.revenue .bar-fill{background:#1687a7}
.trend-chart{padding:4px 16px 16px}.trend-key{display:flex;gap:14px;font-size:.86rem;font-weight:700;margin-bottom:6px}.trend-key i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}.trend-chart svg{width:100%;height:230px;display:block}.trend-grid{stroke:#dce5ed;stroke-width:1}.trend-sale{fill:none;stroke:#6d55b6;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.trend-revenue{fill:none;stroke:#1687a7;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.trend-sale-area{fill:#6d55b633}.trend-revenue-area{fill:#1687a733}.trend-label{fill:#58677b;font-size:13px}
dialog{border:1px solid var(--line);border-radius:14px;padding:0;width:min(520px,calc(100% - 32px));box-shadow:0 20px 45px #18263a40}dialog::backdrop{background:#18263a55}.dialog-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px;border-bottom:1px solid var(--line)}.dialog-head button{border:0;background:transparent;font-size:1.4rem;color:var(--muted)}.dialog-body{display:flex;flex-wrap:wrap;gap:9px;padding:16px}.dialog-body button{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:white;color:var(--accent);font-weight:700}.lead-picker{display:grid;width:100%;gap:10px}.lead-picker button{text-align:left;padding:13px 14px}.lead-picker small{display:block;color:var(--muted);font-weight:400;margin-top:3px}.dialog-back{font-size:.9rem!important;font-weight:700!important;color:var(--accent)!important;margin-right:auto}
@media(max-width:1100px){.cards,.leader-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:850px){.split,.visual-grid{grid-template-columns:1fr}.donut-wrap{grid-template-columns:1fr;justify-items:center}.slicer-menu{grid-template-columns:1fr}.team-chart-row{grid-template-columns:1fr}.team-metric{grid-template-columns:1fr auto}}
@media(max-width:540px){.wrap{width:calc(100% - 24px)}.tools label{width:100%;justify-content:space-between}.cards,.leader-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:8px}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="brand">
    <img class="brand-logo" src="https://cdn.impacteers.com/images/landing-page-v2/impacteers-logo-white1.svg"
      alt="Impacteers logo" width="227" height="76">
  </div>
  <h1>Sales Team Performance</h1>
</div></header>
<main class="wrap">
  <form class="tools" id="filters" aria-label="Report filters">
    <details class="date-slicer" id="date-slicer">
      <summary class="slicer-toggle"><span id="date-slicer-label">All time</span>　⌄</summary>
      <div class="slicer-menu">
        <div class="slicer-column"><h3>Cohort Based</h3>
          <button type="button" class="preset" data-preset="today">Today</button><button type="button" class="preset" data-preset="yesterday">Yesterday</button><button type="button" class="preset" data-preset="week">This Week</button><button type="button" class="preset" data-preset="mtd">Month to Date</button><button type="button" class="preset" data-preset="last7">Last 7 Days</button><button type="button" class="preset" data-preset="last30">Last 30 Days</button><button type="button" class="preset" data-preset="last3months">Last 3 Months</button><button type="button" class="preset" data-preset="custom">Custom Range</button><button type="button" class="preset" data-preset="all">All Time</button>
        </div>
        <div class="slicer-column"><h3>Time Based</h3>
          <button type="button" class="preset" data-preset="today">Today</button><button type="button" class="preset" data-preset="yesterday">Yesterday</button><button type="button" class="preset" data-preset="week">This Week</button><button type="button" class="preset" data-preset="mtd">Month to Date</button><button type="button" class="preset" data-preset="last7">Last 7 Days</button><button type="button" class="preset" data-preset="last30">Last 30 Days</button><button type="button" class="preset" data-preset="last3months">Last 3 Months</button><button type="button" class="preset" data-preset="custom">Custom Range</button><button type="button" class="preset" data-preset="all">All Time</button>
        </div>
        <div class="date-fields" id="date-fields" hidden>
      <label for="start-date">From <input id="start-date" type="date" disabled required></label>
      <label for="end-date">To <input id="end-date" type="date" disabled required></label>
      <button class="apply" type="submit">Apply dates</button>
        </div>
      </div>
    </details>
    <label for="vertical"><select class="filter-select" id="vertical" aria-label="Vertical"></select></label>
    <button class="reset" id="reset-filters" type="button">Reset</button>
    <p class="range-error" id="range-error" role="alert" hidden></p>
  </form>
  <button id="back-button" class="apply" type="button" hidden>← Back</button>
  <nav id="breadcrumb" aria-label="Report navigation"></nav>
  <section id="report" aria-label="Productivity report"></section>
  <dialog id="bde-dialog" aria-label="BDE reports"></dialog>
</main>
<script id="report-data" type="application/json"></script>
<script>
const {ranges, coverage, team, verticals, days: dailyRecords, sample, verticalManagers, unavailableMetrics = []} =
  JSON.parse(document.querySelector("#report-data").textContent);
const firstDate = coverage.start;
const lastDate = coverage.end;
const millisecondsPerDay = 86400000;

const leadStages = [["hot", "Hot"], ["deadJunk", "Dead/Junk"], ["cold", "Cold"], ["warm", "Warm"]];
const measures = ["arrived", "leads", "attempts", "connected", "followups", "stageMoves", "enrolled", "sales", "nbfcApproved", "nbfcRejected", "saleValue", "revenue", "talk", ...leadStages.map(([key]) => key)];
const integerFormat = new Intl.NumberFormat("en-IN");
const number = {format: value => value == null ? "—" : integerFormat.format(value)};
const currency = new Intl.NumberFormat("en-IN", {style: "currency", currency: "INR"});
const rupees = {format: paise => paise == null ? "—" : currency.format(paise / 100)};
const dayFormat = new Intl.DateTimeFormat("en-IN", {weekday: "short", day: "numeric", month: "short", timeZone: "UTC"});
const dateSlicer = document.querySelector("#date-slicer");
const dateSlicerLabel = document.querySelector("#date-slicer-label");
const dateFields = document.querySelector("#date-fields");
const startDate = document.querySelector("#start-date");
const endDate = document.querySelector("#end-date");
const rangeError = document.querySelector("#range-error");
const vertical = document.querySelector("#vertical");
const report = document.querySelector("#report");
const breadcrumb = document.querySelector("#breadcrumb");
const backButton = document.querySelector("#back-button");
const resetFilters = document.querySelector("#reset-filters");
const bdeDialog = document.querySelector("#bde-dialog");
for (const input of [startDate, endDate]) {
  input.min = firstDate;
  input.max = lastDate;
}
let activeRange = ranges.all;
vertical.innerHTML = '<option value="all">All verticals</option>' + verticals.map((name, index) => `<option value="${index}">${name}</option>`).join("");
let selectedBde = null;
let selectedDay = null;
let selectedVerticalScreen = null;
let selectedLead = null;

function total(records) {
  const sums = Object.fromEntries(measures.map(key => [
    key, records.reduce((sum, record) => sum + (record[key] ?? 0), 0),
  ]));
  const contacts = [...new Set(records.flatMap(record => record.contacts ?? []))];
  return {...sums, ...Object.fromEntries(unavailableMetrics.map(key => [key, null])), contacts};
}

function calendarDate(isoDate) {
  return new Date(isoDate + "T00:00:00Z");
}

function reportDays(bde, range) {
  const start = calendarDate(range.start);
  const dayCount = (calendarDate(range.end) - start) / millisecondsPerDay + 1;
  return Array.from({length: dayCount}, (_, offset) => {
    const date = new Date(start.getTime() + offset * millisecondsPerDay);
    const record = dailyRecords[bde.id + "/" + date.toISOString().slice(0, 10)] ?? {};
    const hours = record.hours ?? [];
    return {...total(hours), ...record, date: dayFormat.format(date), hours};
  });
}

function action(label, name, value = "") {
  return `<button class="link" type="button" data-action="${name}" data-value="${value}">${label}</button>`;
}

function cards(items) {
  return `<div class="cards">${items.map(([label, value]) =>
    `<div class="card"><span>${label}</span><strong>${value}</strong></div>`).join("")}</div>`;
}

function duration(seconds) {
  const rounded = Math.round(seconds);
  return Math.floor(rounded / 60) + ":" + String(rounded % 60).padStart(2, "0");
}

function averageTalk(summary) {
  return summary.connected ? duration(summary.talk / summary.connected) : "—";
}

function metrics(summary, extra = []) {
  return cards([...extra, ["Leads arrived", number.format(summary.arrived)],
    ["Call attempts", number.format(summary.attempts)], ["Unique calls", number.format(summary.contacts.length)],
    ["Connected calls", number.format(summary.connected)], ["Avg. talk time (mm:ss)", averageTalk(summary)],
    ["Enrolled", number.format(summary.enrolled)], ["NBFC approved", number.format(summary.nbfcApproved)], ["NBFC rejected", number.format(summary.nbfcRejected)],
    ["Sale value", rupees.format(summary.saleValue)],
    ["Revenue", rupees.format(summary.revenue)]]);
}

function table(title, headers, rows, {note = "", footer = "", textCols = [], scrollable = true, className = ""} = {}) {
  return `<section class="panel"><div class="section-head"><h3>${title}</h3>
    ${note ? `<p class="muted">${note}</p>` : ""}</div>
    <div class="${scrollable ? "scroll" : "table-fit"}"${scrollable ? ` tabindex="0" role="region" aria-label="${title}"` : ""}><table class="${className}">
    <thead><tr>${headers.map((label, index) => `<th scope="col" class="${textCols.includes(index) ? "text" : ""}">${label}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(row => `<tr>${row.map((cell, index) => `<td class="${textCols.includes(index) ? "text" : ""}">${cell}</td>`).join("")}</tr>`).join("")}</tbody>
    ${footer ? `<tfoot><tr>${footer.map(cell => `<td>${cell}</td>`).join("")}</tr></tfoot>` : ""}
    </table></div></section>`;
}

function renderOverview(range) {
  const members = team.filter(member => vertical.value === "all" || member.vertical === Number(vertical.value))
    .map(member => ({...member, summary: total(reportDays(member, range))}));
  const groups = verticals.map((name, index) => ({
    name, index, members: members.filter(member => member.vertical === index),
  })).filter(group => vertical.value === "all" || group.index === Number(vertical.value));
  const groupSummaries = groups.map(group => ({...group, summary: total(group.members.map(member => member.summary))}))
    .sort((a, b) => b.summary.saleValue - a.summary.saleValue || b.summary.revenue - a.summary.revenue);
  const memberDays = members.map(member => reportDays(member, range));
  const trend = memberDays.length ? memberDays[0].map((day, index) => total(memberDays.map(days => days[index]))) : [];
  const trendMax = Math.max(1, ...trend.flatMap(day => [day.saleValue, day.revenue]));
  const trendPoints = key => trend.map((day, index) => `${30 + (trend.length < 2 ? 0 : 900 * index / (trend.length - 1))},${190 - 145 * (day[key] || 0) / trendMax}`).join(" ");
  const trendArea = key => `30,190 ${trendPoints(key)} 930,190`;
  const trendVisual = `<section class="panel"><div class="section-head"><h3>Sale value and Revenue area chart</h3></div><div class="trend-chart"><div class="trend-key"><span><i style="background:#6d55b6"></i>Sale value</span><span><i style="background:#1687a7"></i>Revenue</span></div><svg viewBox="0 0 960 230" role="img" aria-label="Sale value and Revenue area chart over the selected period"><line class="trend-grid" x1="30" y1="45" x2="930" y2="45"/><line class="trend-grid" x1="30" y1="118" x2="930" y2="118"/><line class="trend-grid" x1="30" y1="190" x2="930" y2="190"/><polygon class="trend-sale-area" points="${trendArea("saleValue")}"/><polygon class="trend-revenue-area" points="${trendArea("revenue")}"/><polyline class="trend-sale" points="${trendPoints("saleValue")}"/><polyline class="trend-revenue" points="${trendPoints("revenue")}"/><text class="trend-label" x="30" y="218">${range.start}</text><text class="trend-label" x="930" y="218" text-anchor="end">${range.end}</text></svg></div></section>`;
  const top = (label, entry, value, note = "") => `<article class="leader-card"><span>${label}</span><strong>${entry?.name || "—"}</strong><b>${value}</b>${note ? `<small>${note}</small>` : ""}</article>`;
  const leaderCards = group => { const ranked = group.members.map(member => ({...member, summary: member.summary})); const highest = key => ranked.slice().sort((a, b) => b.summary[key] - a.summary[key])[0]; const callDays = group.members.flatMap(member => reportDays(member, range).map(day => ({member, day}))).sort((a, b) => b.day.attempts - a.day.attempts); return `<div class="leader-grid">${top("Highest total talk time", highest("talk"), duration(highest("talk")?.summary.talk || 0))}${top("Highest sales count", highest("sales"), number.format(highest("sales")?.summary.sales || 0))}${top("Highest sale value", highest("saleValue"), rupees.format(highest("saleValue")?.summary.saleValue || 0))}${top("Highest revenue", highest("revenue"), rupees.format(highest("revenue")?.summary.revenue || 0))}${top("Highest calls in a day", callDays[0]?.member, number.format(callDays[0]?.day.attempts || 0), callDays[0]?.day.date || "")}</div>`; };
  const leaders = `<section class="panel"><div class="section-head"><h3>Top performers by vertical</h3></div>${groups.map(group => `<div class="leader-vertical"><h4>${group.name}</h4>${leaderCards(group)}</div>`).join("")}</section>`;
  return `${metrics(total(members.map(member => member.summary)), [["BDEs", members.length]])}
  ${table("Vertical performance", ["Vertical", "Manager", "BDEs", "Leads arrived", "Call attempts", "Enrolled", "Sale value", "Revenue", ""],
    groupSummaries.map(group => {
      const summary = group.summary;
      return [group.name, verticalManagers[group.name] || "", group.members.length, number.format(summary.arrived), number.format(summary.attempts), number.format(summary.enrolled), rupees.format(summary.saleValue), rupees.format(summary.revenue),
        action("Open BDE reports →", "vertical", group.index)];
    }), {textCols: [1, 8], scrollable: false, className: "vertical-table"})}
  ${leaders}
  ${trendVisual}`;
}

function leadLabel(member) {
  return member.lead || `Direct to ${verticalManagers[verticals[member.vertical]] || "manager"}`;
}

function verticalTitle(index) {
  return verticals[index] === "Govt Central" ? "RRB, SSC & Banking · Dilip Kumar" : `${verticals[index]} · ${verticalManagers[verticals[index]] || ""}`;
}

function performanceRows(members) {
  return members.map(member => {
    const summary = total(reportDays(member, activeRange));
    return {member, summary};
  }).sort((a, b) => b.summary.saleValue - a.summary.saleValue || b.summary.revenue - a.summary.revenue || b.summary.leads - a.summary.leads)
    .map(({member, summary}) => [member.name, number.format(summary.leads), number.format(summary.arrived), number.format(summary.attempts), number.format(summary.connected), number.format(summary.enrolled), rupees.format(summary.saleValue), rupees.format(summary.revenue), action("Open report →", "bde", member.id)]);
}

function renderVerticalScreen(index) {
  const members = team.filter(member => member.vertical === index);
  const summary = total(members.map(member => total(reportDays(member, activeRange))));
  const groups = [...new Set(members.map(leadLabel))].map(lead => ({lead, members: members.filter(member => leadLabel(member) === lead)}));
  return `<h2 tabindex="-1">${verticalTitle(index)}</h2><p class="muted">Team performance and individual BDE reports</p>
    ${metrics(summary, [["BDEs", members.length], ["Leads received", number.format(summary.leads)]])}
    ${table("Team performance", ["Team Lead", "BDEs", "Leads received", "Leads arrived", "Call attempts", "Sale value", "Revenue", ""], groups.map(group => { const value = total(group.members.map(member => total(reportDays(member, activeRange)))); return [group.lead, group.members.length, number.format(value.leads), number.format(value.arrived), number.format(value.attempts), rupees.format(value.saleValue), rupees.format(value.revenue), action("View team →", "team", `${index}|${group.lead}`)]; }), {textCols:[0,7], scrollable:false, className:"vertical-table"})}
    ${table("Individual BDE performance", ["BDE", "Leads received", "Leads arrived", "Call attempts", "Connected", "Enrolled", "Sale value", "Revenue", ""], performanceRows(members), {textCols:[0,8], scrollable:false, className:"vertical-table"})}`;
}

function renderTeamScreen(index, lead) {
  const members = team.filter(member => member.vertical === index && leadLabel(member) === lead);
  const summary = total(members.map(member => total(reportDays(member, activeRange))));
  return `<h2 tabindex="-1">${lead} · Team performance</h2><p class="muted">${verticalTitle(index)}</p>
    ${metrics(summary, [["BDEs", members.length], ["Leads received", number.format(summary.leads)]])}
    ${table("Individual BDE performance", ["BDE", "Leads received", "Leads arrived", "Call attempts", "Connected", "Enrolled", "Sale value", "Revenue", ""], performanceRows(members), {textCols:[0,8], scrollable:false, className:"vertical-table"})}`;
}

function renderBde(bde, days) {
  days = days.slice().sort((a, b) => b.saleValue - a.saleValue || b.revenue - a.revenue || b.arrived - a.arrived);
  return `<h2 tabindex="-1">${bde.name} · Productivity</h2>
    <p class="muted">${verticals[bde.vertical]} · ${bde.lead}</p>
    ${metrics(total(days))}
    ${table("Day-wise performance", ["Day", "Leads arrived", "Leads received", "Call attempts", "Unique calls", "Connected", "Avg. talk time", "Follow-ups completed", "Enrolled", "Sale value", "Revenue", ""],
      days.map((day, index) => [day.date, day.arrived, day.leads, day.attempts, day.contacts.length, day.connected,
        averageTalk(day), number.format(day.followups), number.format(day.enrolled), rupees.format(day.saleValue), rupees.format(day.revenue), action("View day →", "day", index)]),
      {textCols: [10]})}`;
}

function renderDaily(bde, day) {
  const rate = (connected, attempts) => attempts ? Math.round(100 * connected / attempts) + "%" : "—";
  const callingCells = summary => [summary.attempts, summary.contacts.length, summary.connected, summary.attempts - summary.connected,
    duration(summary.talk), averageTalk(summary), rate(summary.connected, summary.attempts)];
  const hours = day.hours.map(hour => [
    `${String(hour.hour).padStart(2, "0")}:00–${hour.hour + 1}:00`, ...callingCells(hour),
  ]);
  return `<h2 tabindex="-1">${bde.name} · ${day.date}</h2>
    ${metrics(day)}
    <div class="split">
    ${table("Hourly calling activity", ["Hour (IST)", "Call attempts", "Unique calls", "Connected", "Not connected (>2s rule)", "Talk time (mm:ss)", "Avg. talk time (mm:ss)", "Connection rate"], hours,
      {footer: ["Day total", ...callingCells(day)]})}
    ${table("Daily CRM activity", ["CRM metric", "Value"], [
      ["Leads arrived", day.arrived], ["Leads received", day.leads], ["Dead/Junk leads", day.deadJunk], ["Follow-ups completed", number.format(day.followups)], ["Pending follow-ups", number.format(day.pending)],
      ["Enrolled", number.format(day.enrolled)], ["NBFC rejected", number.format(day.nbfcRejected)], ["Sale value", rupees.format(day.saleValue)], ["Revenue", rupees.format(day.revenue)],
    ])}
    </div>`;
}

function render(focusHeading = false) {
  backButton.hidden = selectedBde === null && selectedVerticalScreen === null && vertical.value === "all";
  backButton.textContent = selectedDay !== null ? "← Back to BDE report" : selectedBde !== null ? (selectedLead !== null ? "← Back to team performance" : "← Back to vertical performance") : selectedLead !== null ? "← Back to vertical performance" : "← Back to overview";
  const bde = team.find(member => member.id === selectedBde);
  const days = bde ? reportDays(bde, activeRange).sort((a, b) => b.saleValue - a.saleValue || b.revenue - a.revenue || b.arrived - a.arrived) : [];
  if (selectedBde !== null && bde) {
    breadcrumb.hidden = false;
    breadcrumb.innerHTML = selectedDay === null ? '<span aria-current="page">BDE report</span>' : action("BDE report", "weekly") + '<span>›</span><span aria-current="page">Daily detail</span>';
    report.innerHTML = selectedDay === null ? renderBde(bde, days) : renderDaily(bde, days[selectedDay]);
  } else if (selectedLead !== null && selectedVerticalScreen !== null) {
    breadcrumb.hidden = false;
    breadcrumb.innerHTML = '<span aria-current="page">Team performance</span>';
    report.innerHTML = renderTeamScreen(selectedVerticalScreen, selectedLead);
  } else if (selectedVerticalScreen !== null) {
    breadcrumb.hidden = false;
    breadcrumb.innerHTML = '<span aria-current="page">Vertical performance</span>';
    report.innerHTML = renderVerticalScreen(selectedVerticalScreen);
  } else {
    breadcrumb.hidden = true;
    breadcrumb.innerHTML = "";
    report.innerHTML = renderOverview(activeRange);
  }
  if (focusHeading) report.querySelector("h2")?.focus();
}

backButton.addEventListener("click", () => {
  if (selectedDay !== null) selectedDay = null;
  else if (selectedBde !== null) selectedBde = null;
  else if (selectedLead !== null) selectedLead = null;
  else if (selectedVerticalScreen !== null) { selectedVerticalScreen = null; vertical.value = "all"; }
  else vertical.value = "all";
  render(true);
});

document.querySelector("main").addEventListener("click", event => {
  const button = event.target.closest("button[data-action]");
  if (!button) return;
  const {action: type, value} = button.dataset;
  if (type === "vertical") {
    selectedVerticalScreen = Number(value);
    selectedLead = null;
    selectedBde = null;
    selectedDay = null;
    vertical.value = value;
    render(true);
    return;
  }
  if (type === "team") { const [verticalIndex, lead] = value.split("|"); selectedVerticalScreen = Number(verticalIndex); selectedLead = lead; selectedBde = null; selectedDay = null; render(true); return; }
  if (type === "overview") selectedBde = null;
  if (type === "bde") { selectedBde = Number(value); }
  selectedDay = type === "day" ? Number(value) : null;
  render(true);
});
const rangeFormat = new Intl.DateTimeFormat("en-GB", {
  day: "numeric", month: "short", year: "numeric", timeZone: "UTC",
});

function rangeLabel(range) {
  const start = calendarDate(range.start);
  const end = calendarDate(range.end);
  if (range.start === range.end) return rangeFormat.format(start);
  if (range.start.slice(0, 7) === range.end.slice(0, 7)) {
    return `${start.getUTCDate()}–${rangeFormat.format(end)}`;
  }
  return rangeFormat.format(start) + " – " + rangeFormat.format(end);
}

function applyRange(range) {
  activeRange = range;
  selectedDay = null;
  rangeError.hidden = true;
  render();
}

function isoDate(date) {
  return date.toISOString().slice(0, 10);
}

function todayInIst() {
  const parts = Object.fromEntries(new Intl.DateTimeFormat("en-US", {timeZone: "Asia/Kolkata", year: "numeric", month: "2-digit", day: "2-digit"})
    .formatToParts(new Date()).filter(part => part.type !== "literal").map(part => [part.type, part.value]));
  return `${parts.year}-${parts.month}-${parts.day}`;
}

function rangeForPreset(preset) {
  const end = calendarDate(todayInIst());
  const endKey = isoDate(end);
  const startAt = date => ({start: isoDate(date < calendarDate(firstDate) ? calendarDate(firstDate) : date), end: endKey});
  if (preset === "all") return ranges.all;
  if (preset === "today") return {start: lastDate, end: lastDate};
  if (preset === "yesterday") { const yesterday = isoDate(new Date(end.getTime() - millisecondsPerDay)); return {start: yesterday, end: yesterday}; }
  if (preset === "last7") return startAt(new Date(end.getTime() - 6 * millisecondsPerDay));
  if (preset === "last30") return startAt(new Date(end.getTime() - 29 * millisecondsPerDay));
  if (preset === "week") {
    const mondayOffset = (end.getUTCDay() + 6) % 7;
    return startAt(new Date(end.getTime() - mondayOffset * millisecondsPerDay));
  }
  if (preset === "mtd") return startAt(new Date(Date.UTC(end.getUTCFullYear(), end.getUTCMonth(), 1)));
  if (preset === "last3months") return startAt(new Date(Date.UTC(end.getUTCFullYear(), end.getUTCMonth() - 2, 1)));
  return ranges.all;
}

const presetLabels = {today: "Today", yesterday: "Yesterday", week: "This Week", mtd: "Month to Date", last7: "Last 7 Days", last30: "Last 30 Days", last3months: "Last 3 Months", all: "All Time", custom: "Custom Range"};
document.querySelectorAll(".preset").forEach(button => button.addEventListener("click", () => {
  const preset = button.dataset.preset;
  dateSlicerLabel.textContent = presetLabels[preset];
  if (preset === "custom") {
    dateFields.hidden = false;
    startDate.disabled = endDate.disabled = false;
    startDate.value = activeRange.start;
    endDate.value = activeRange.end;
    startDate.focus();
    return;
  }
  dateFields.hidden = true;
  startDate.disabled = endDate.disabled = true;
  dateSlicer.open = false;
  applyRange(rangeForPreset(preset));
}));

document.querySelector("#filters").addEventListener("submit", event => {
  event.preventDefault();
  if (startDate.value < firstDate || endDate.value > lastDate || startDate.value > endDate.value) {
    rangeError.textContent = "Choose dates within the available range, with the end on or after the start.";
    rangeError.hidden = false;
    endDate.focus();
    return;
  }
  dateSlicer.open = false;
  applyRange({start: startDate.value, end: endDate.value});
});
resetFilters.addEventListener("click", () => {
  dateSlicerLabel.textContent = "All Time";
  dateSlicer.open = false;
  dateFields.hidden = true;
  startDate.disabled = endDate.disabled = true;
  vertical.value = "all";
  selectedBde = null;
  selectedDay = null;
  selectedVerticalScreen = null;
  selectedLead = null;
  applyRange(ranges.all);
});
vertical.addEventListener("change", () => {
  selectedDay = null;
  selectedBde = null;
  selectedVerticalScreen = null;
  selectedLead = null;
  render();
});
render();
</script>
</body>
</html>
